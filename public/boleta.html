<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprobante - MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    body { background: #eee; }
    .hoja-boleta {
      max-width: 620px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,.15);
    }
    .boleta-items th, .boleta-items td { font-size: .9rem; }
    .boleta-totales td { padding: 2px 0; }
    @media print {
      body { background: #fff; }
      .no-imprimir { display: none !important; }
      .hoja-boleta { box-shadow: none; margin: 0; max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container no-imprimir py-3">
    <a href="/index.html" class="text-decoration-none fw-bold text-danger">&larr; MALMOQ</a>
  </div>

  <div class="hoja-boleta" id="contenido-boleta">
    <p class="text-center text-muted py-5">Cargando comprobante...</p>
  </div>

  <div class="container no-imprimir text-center pb-5">
    <button class="btn btn-primary" id="btn-imprimir" hidden onclick="window.print()">Imprimir / Guardar como PDF</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pages/boleta.js"></script>
</body>
</html>
