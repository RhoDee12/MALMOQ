<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion - MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="site-header"></div>

  <main class="container">
    <div class="auth-card">
      <h1 class="font-black text-center mb-4">Iniciar sesion</h1>
      <div id="login-error" class="alert alert-danger" hidden></div>
      <form id="form-login">
        <div class="mb-3">
          <label class="form-label small">Correo</label>
          <input type="email" class="form-control" id="input-email" required>
        </div>
        <div class="mb-3">
          <label class="form-label small">Contrasena</label>
          <input type="password" class="form-control" id="input-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btn-login">Ingresar</button>
      </form>
      <p class="text-center small mt-3">
        No tienes cuenta? <a href="/registro.html">Registrate aqui</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
