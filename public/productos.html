<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="site-header"></div>

  <main class="container my-4">
    <h1 class="font-black mb-4">Catalogo de productos</h1>

    <div class="row">
      <!-- FILTROS -->
      <aside class="col-lg-3 mb-4">
        <div class="border rounded-malmoq p-3">
          <h6 class="font-semibold">Categoria</h6>
          <select class="form-select form-select-sm mb-3" id="filtro-categoria">
            <option value="">Todas</option>
          </select>

          <h6 class="font-semibold">Marca</h6>
          <select class="form-select form-select-sm mb-3" id="filtro-marca">
            <option value="">Todas</option>
          </select>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="filtro-promo">
            <label class="form-check-label small" for="filtro-promo">Solo promociones</label>
          </div>

          <h6 class="font-semibold">Ordenar por</h6>
          <select class="form-select form-select-sm mb-3" id="filtro-orden">
            <option value="recientes">Mas recientes</option>
            <option value="masVendidos">Mas vendidos</option>
            <option value="precioAsc">Precio: menor a mayor</option>
            <option value="precioDesc">Precio: mayor a menor</option>
          </select>

          <button class="btn btn-primary btn-sm w-100" id="btn-aplicar-filtros">Aplicar filtros</button>
        </div>
      </aside>

      <!-- RESULTADOS -->
      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-secondary small" id="resultado-contador"></span>
        </div>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="productos-grid">
          <div class="col text-center text-muted py-5">Cargando productos...</div>
        </div>
        <nav class="mt-4">
          <ul class="pagination justify-content-center" id="paginacion"></ul>
        </nav>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/product-card.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/catalogo.js"></script>
</body>
</html>
