<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcas - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Marcas">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <p class="text-muted small mb-3">
      Las marcas (ej: Tabernero, Concha y Toro, Absolut) sirven para clasificar los productos
      dentro de cada categoria y para que el cliente pueda filtrar por marca en la tienda.
      Cada producto se asigna a una marca desde <a href="/admin/productos.html">Productos</a>.
    </p>

    <div class="admin-card">
      <h5 class="font-semibold mb-3">Agregar marca</h5>
      <form id="form-marca" class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small">Nombre</label>
          <input type="text" class="form-control form-control-sm" id="m-nombre" required>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-admin-primary btn-sm">Agregar</button>
        </div>
      </form>
    </div>

    <div class="admin-card p-0">
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th>Nombre</th><th></th></tr></thead>
          <tbody id="tabla-marcas"><tr><td colspan="2" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/marcas.js"></script>
</body>
</html>
