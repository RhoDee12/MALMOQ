<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Categorias">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="admin-card">
      <h5 class="font-semibold mb-3">Agregar categoria</h5>
      <form id="form-categoria" class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small">Nombre</label>
          <input type="text" class="form-control form-control-sm" id="c-nombre" required>
        </div>
        <div class="col-md-2">
          <label class="form-label small">Orden</label>
          <input type="number" class="form-control form-control-sm" id="c-orden" value="0">
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-admin-primary btn-sm">Agregar</button>
        </div>
      </form>
    </div>

    <div class="admin-card p-0">
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th></th><th>Nombre</th><th>Orden</th><th>Estado</th><th>Imagen</th><th></th></tr></thead>
          <tbody id="tabla-categorias"><tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/categorias.js"></script>
</body>
</html>
