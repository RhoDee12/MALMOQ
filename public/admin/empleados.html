<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Empleados">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-admin-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal-empleado" onclick="abrirModalNuevoEmpleado()">+ Nuevo empleado</button>
    </div>

    <div class="admin-card p-0">
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th>Nombre</th><th>Correo</th><th>Permisos</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tabla-empleados"><tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL: crear/editar empleado -->
    <div class="modal fade" id="modal-empleado" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="form-empleado">
            <div class="modal-header">
              <h5 class="modal-title" id="modal-empleado-titulo">Nuevo empleado</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="e-id">
              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label small">Nombre</label>
                  <input type="text" class="form-control form-control-sm" id="e-nombre" required>
                </div>
                <div class="col-6">
                  <label class="form-label small">Apellidos</label>
                  <input type="text" class="form-control form-control-sm" id="e-apellidos" required>
                </div>
                <div class="col-6">
                  <label class="form-label small">Correo</label>
                  <input type="email" class="form-control form-control-sm" id="e-email" required>
                </div>
                <div class="col-6">
                  <label class="form-label small">Celular</label>
                  <input type="text" class="form-control form-control-sm" id="e-celular">
                </div>
                <div class="col-12" id="grupo-password-nuevo">
                  <label class="form-label small">Contrasena inicial (minimo 6 caracteres)</label>
                  <input type="password" class="form-control form-control-sm" id="e-password" minlength="6">
                </div>
                <div class="col-12"><hr class="my-2"><span class="small fw-semibold">Permisos</span></div>
                <div class="col-6 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-productos">
                  <label class="form-check-label small" for="e-perm-productos">Gestionar productos</label>
                </div>
                <div class="col-6 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-inventario" checked>
                  <label class="form-check-label small" for="e-perm-inventario">Gestionar inventario</label>
                </div>
                <div class="col-6 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-pedidos" checked>
                  <label class="form-check-label small" for="e-perm-pedidos">Gestionar pedidos</label>
                </div>
                <div class="col-6 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-ventas" checked>
                  <label class="form-check-label small" for="e-perm-ventas">Registrar ventas</label>
                </div>
                <div class="col-6 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-clientes">
                  <label class="form-check-label small" for="e-perm-clientes">Ver clientes</label>
                </div>
                <div class="col-12 form-check">
                  <input class="form-check-input" type="checkbox" id="e-perm-editar-confirmados">
                  <label class="form-check-label small" for="e-perm-editar-confirmados">
                    Editar pedidos ya confirmados/cerrados
                    <span class="text-secondary">(excepcional - por defecto solo el jefe puede)</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-admin-primary btn-sm">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/empleados.js"></script>
</body>
</html>
