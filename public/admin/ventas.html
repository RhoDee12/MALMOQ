<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Ventas / POS">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-nueva-venta">Nueva venta</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-historial-ventas">Historial</button></li>
    </ul>

    <div class="tab-content">
      <!-- NUEVA VENTA (POS presencial) -->
      <div class="tab-pane fade show active" id="tab-nueva-venta">
        <div class="row g-3">
          <div class="col-lg-7">
            <div class="admin-card">
              <label class="form-label small">Buscar producto (nombre o SKU)</label>
              <input type="text" class="form-control form-control-sm mb-2" id="pos-buscador">
              <div id="pos-resultados" class="list-group" style="max-height:260px; overflow-y:auto;"></div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="admin-card">
              <h6 class="font-semibold">Carrito de venta</h6>
              <div id="pos-carrito"><p class="text-muted small">Aun no agregaste productos.</p></div>
              <hr>
              <div class="mb-2">
                <label class="form-label small">Cliente (opcional)</label>
                <input type="text" class="form-control form-control-sm" id="pos-cliente" placeholder="Nombre del cliente">
              </div>
              <div class="mb-2">
                <label class="form-label small">Medio de pago</label>
                <select class="form-select form-select-sm" id="pos-medio-pago"></select>
              </div>
              <div class="d-flex justify-content-between fw-bold fs-5 mb-2">
                <span>Total</span><span id="pos-total">S/ 0.00</span>
              </div>
              <button class="btn btn-admin-primary w-100" id="btn-registrar-venta">Registrar venta</button>
            </div>
          </div>
        </div>
      </div>

      <!-- HISTORIAL -->
      <div class="tab-pane fade" id="tab-historial-ventas">
        <div class="admin-card p-0">
          <div class="table-responsive">
            <table class="table table-admin mb-0">
              <thead><tr><th>Fecha</th><th>Canal</th><th>Medio pago</th><th>Total</th><th>Comprobante</th><th></th></tr></thead>
              <tbody id="tabla-ventas"><tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/ventas.js"></script>
</body>
</html>
