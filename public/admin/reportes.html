<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Reportes">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="admin-card">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small">Desde</label>
          <input type="date" class="form-control form-control-sm" id="rep-desde">
        </div>
        <div class="col-md-3">
          <label class="form-label small">Hasta</label>
          <input type="date" class="form-control form-control-sm" id="rep-hasta">
        </div>
        <div class="col-md-3">
          <button class="btn btn-admin-primary btn-sm" id="btn-filtrar-reportes">Filtrar</button>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h5 class="font-semibold mb-3">Ventas por medio de pago</h5>
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th>Medio de pago</th><th># Ventas</th><th>Ventas (S/)</th><th>Comision (S/)</th><th>Neto (S/)</th></tr></thead>
          <tbody id="tabla-medios-pago"><tr><td colspan="5" class="text-center text-muted py-3">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="admin-card">
          <h5 class="font-semibold mb-3">Productos mas vendidos</h5>
          <ol id="lista-top-productos" class="small"></ol>
        </div>
      </div>
      <div class="col-md-6">
        <div class="admin-card">
          <h5 class="font-semibold mb-3">Categorias mas vendidas</h5>
          <ol id="lista-top-categorias" class="small"></ol>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="font-semibold mb-0">Detalle de ventas</h5>
        <span class="small text-secondary" id="reporte-ventas-total"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th>Fecha</th><th>Canal</th><th>Medio pago</th><th>Subtotal</th><th>IGV</th><th>Comision</th><th>Total</th></tr></thead>
          <tbody id="tabla-detalle-ventas"><tr><td colspan="7" class="text-center text-muted py-3">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/reportes.js"></script>
</body>
</html>
