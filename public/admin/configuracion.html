<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuracion - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Configuracion / Personalizar MALMOQ">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general">General</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-imagenes">Imagenes</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-tributario">IGV / Comprobantes</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pagos">Medios de pago</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-delivery">Delivery</button></li>
    </ul>

    <div class="tab-content">
      <!-- GENERAL -->
      <div class="tab-pane fade show active" id="tab-general">
        <form id="form-general" class="admin-card">
          <h5 class="font-semibold mb-3">Home / Hero</h5>
          <div class="mb-2">
            <label class="form-label small">Titulo</label>
            <input type="text" class="form-control form-control-sm" id="cfg-hero-titulo">
          </div>
          <div class="mb-3">
            <label class="form-label small">Subtitulo</label>
            <input type="text" class="form-control form-control-sm" id="cfg-hero-subtitulo">
          </div>

          <h5 class="font-semibold mb-3">WhatsApp</h5>
          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <label class="form-label small">Numero (con codigo de pais, ej: 51987654321)</label>
              <input type="text" class="form-control form-control-sm" id="cfg-whatsapp-numero">
            </div>
            <div class="col-md-8">
              <label class="form-label small">Mensaje automatico</label>
              <input type="text" class="form-control form-control-sm" id="cfg-whatsapp-mensaje">
            </div>
          </div>

          <h5 class="font-semibold mb-3">Datos de la empresa</h5>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label small">Nombre comercial</label>
              <input type="text" class="form-control form-control-sm" id="cfg-nombre-comercial">
            </div>
            <div class="col-md-6">
              <label class="form-label small">Direccion</label>
              <input type="text" class="form-control form-control-sm" id="cfg-direccion">
            </div>
          </div>

          <button type="submit" class="btn btn-admin-primary btn-sm mt-3">Guardar cambios</button>
        </form>
      </div>

      <!-- IMAGENES -->
      <div class="tab-pane fade" id="tab-imagenes">
        <div class="admin-card">
          <h5 class="font-semibold mb-3">Logo, favicon e imagen del Home</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small d-block">Logo</label>
              <img id="preview-logo" class="mb-2" style="max-height:60px;">
              <input type="file" accept="image/*" class="form-control form-control-sm" onchange="subirImagenMarca('logo', this.files[0])">
            </div>
            <div class="col-md-4">
              <label class="form-label small d-block">Favicon</label>
              <img id="preview-favicon" class="mb-2" style="max-height:40px;">
              <input type="file" accept="image/*" class="form-control form-control-sm" onchange="subirImagenMarca('favicon', this.files[0])">
            </div>
            <div class="col-md-4">
              <label class="form-label small d-block">Imagen del Hero (Home)</label>
              <img id="preview-hero" class="mb-2" style="max-height:60px;">
              <input type="file" accept="image/*" class="form-control form-control-sm" onchange="subirImagenMarca('hero', this.files[0])">
            </div>
          </div>
        </div>
      </div>

      <!-- TRIBUTARIO -->
      <div class="tab-pane fade" id="tab-tributario">
        <form id="form-tributario" class="admin-card">
          <div class="row g-2">
            <div class="col-md-3">
              <label class="form-label small">% IGV</label>
              <input type="number" step="0.01" class="form-control form-control-sm" id="cfg-igv">
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cfg-precios-incluyen-igv">
                <label class="form-check-label small" for="cfg-precios-incluyen-igv">Los precios ya incluyen IGV</label>
              </div>
            </div>
            <div class="col-md-5">
              <label class="form-label small">RUC</label>
              <input type="text" class="form-control form-control-sm" id="cfg-ruc">
            </div>
            <div class="col-md-12">
              <label class="form-label small">Razon social</label>
              <input type="text" class="form-control form-control-sm" id="cfg-razon-social">
            </div>
          </div>
          <button type="submit" class="btn btn-admin-primary btn-sm mt-3">Guardar</button>
        </form>
      </div>

      <!-- MEDIOS DE PAGO -->
      <div class="tab-pane fade" id="tab-pagos">
        <div id="medios-pago-config"></div>

        <div class="admin-card">
          <h5 class="font-semibold mb-2">Comision Pocket POS</h5>
          <p class="small text-secondary">
            El % vigente se aplica a las ventas nuevas con tarjeta. Al registrar una nueva comision, la
            anterior queda cerrada automaticamente - las ventas ya realizadas NO cambian.
          </p>
          <div id="comision-actual" class="mb-2"></div>
          <form id="form-comision" class="row g-2">
            <div class="col-md-3">
              <label class="form-label small">Nuevo % de comision</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="cfg-comision-porcentaje" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small">Proveedor (opcional)</label>
              <input type="text" class="form-control form-control-sm" id="cfg-comision-proveedor">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button type="submit" class="btn btn-admin-primary btn-sm">Actualizar comision</button>
            </div>
          </form>
        </div>
      </div>

      <!-- DELIVERY -->
      <div class="tab-pane fade" id="tab-delivery">
        <div class="admin-card">
          <h5 class="font-semibold mb-3">Zonas de delivery</h5>
          <form id="form-zona" class="row g-2 mb-3">
            <div class="col-md-4">
              <label class="form-label small">Nombre de la zona</label>
              <input type="text" class="form-control form-control-sm" id="z-nombre" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small">Costo (S/)</label>
              <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="z-costo" value="0">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="z-gratis">
                <label class="form-check-label small" for="z-gratis">Gratis</label>
              </div>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button type="submit" class="btn btn-admin-primary btn-sm">Agregar zona</button>
            </div>
          </form>
          <table class="table table-admin mb-0">
            <thead><tr><th>Zona</th><th>Costo</th><th>Estado</th><th></th></tr></thead>
            <tbody id="tabla-zonas"></tbody>
          </table>
        </div>

        <form id="form-delivery-min" class="admin-card row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small">Pedido minimo para delivery (S/)</label>
            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="cfg-delivery-min">
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-admin-primary btn-sm">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/configuracion.js"></script>
</body>
</html>
