<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Pedidos online">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <select class="form-select form-select-sm w-auto" id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="PAGO_PENDIENTE">Pago pendiente</option>
        <option value="PAGO_CONFIRMADO">Pago confirmado</option>
        <option value="PREPARANDO">Preparando</option>
        <option value="EN_CAMINO">En camino</option>
        <option value="LISTO_RECOJO">Listo para recojo</option>
        <option value="ENTREGADO">Entregado</option>
        <option value="CANCELADO">Cancelado</option>
      </select>
    </div>

    <div id="lista-pedidos-admin"><p class="text-muted">Cargando pedidos...</p></div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/pedidos.js"></script>
</body>
</html>
