<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Dashboard">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="admin-kpi">
          <div class="kpi-label">Ventas hoy</div>
          <div class="kpi-value" id="kpi-ventas-hoy">S/ 0.00</div>
          <div class="small text-secondary" id="kpi-cantidad-hoy">0 ventas</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="admin-kpi">
          <div class="kpi-label">Ventas del mes</div>
          <div class="kpi-value" id="kpi-ventas-mes">S/ 0.00</div>
          <div class="small text-secondary" id="kpi-cantidad-mes">0 ventas</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="admin-kpi">
          <div class="kpi-label">Pedidos pendientes</div>
          <div class="kpi-value" id="kpi-pedidos-pendientes">0</div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="admin-kpi">
          <div class="kpi-label">Stock bajo</div>
          <div class="kpi-value" id="kpi-stock-bajo">0</div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-4">
        <div class="admin-kpi">
          <div class="kpi-label">IGV generado (mes)</div>
          <div class="kpi-value" id="kpi-igv-mes">S/ 0.00</div>
        </div>
      </div>
      <div class="col-6 col-lg-4">
        <div class="admin-kpi">
          <div class="kpi-label">Comisiones tarjeta (mes)</div>
          <div class="kpi-value" id="kpi-comisiones-mes">S/ 0.00</div>
        </div>
      </div>
      <div class="col-6 col-lg-4">
        <div class="admin-kpi">
          <div class="kpi-label">Total clientes</div>
          <div class="kpi-value" id="kpi-total-clientes">0</div>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <h5 class="font-semibold">Accesos rapidos</h5>
      <div class="d-flex gap-2 flex-wrap">
        <a href="/admin/ventas.html" id="acceso-ventas" class="btn btn-admin-primary btn-sm">Registrar venta presencial</a>
        <a href="/admin/pedidos.html" id="acceso-pedidos" class="btn btn-outline-secondary btn-sm">Ver pedidos online</a>
        <a href="/admin/inventario.html" id="acceso-inventario" class="btn btn-outline-secondary btn-sm">Revisar inventario</a>
        <a href="/admin/productos.html" class="btn btn-outline-secondary btn-sm">Agregar producto</a>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/dashboard.js"></script>
</body>
</html>
