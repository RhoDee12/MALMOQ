<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Panel MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-body" data-page-title="Inventario">

  <div id="admin-shell"></div>

  <template id="admin-page-content">
    <div class="admin-card p-0">
      <div class="table-responsive">
        <table class="table table-admin mb-0">
          <thead><tr><th></th><th>Producto</th><th>Categoria</th><th>Stock actual</th><th>Stock minimo</th><th></th></tr></thead>
          <tbody id="tabla-inventario"><tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL: registrar movimiento -->
    <div class="modal fade" id="modal-movimiento" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="form-movimiento">
            <div class="modal-header">
              <h5 class="modal-title">Registrar movimiento - <span id="movimiento-producto-nombre"></span></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="m-producto-id">
              <div class="mb-2">
                <label class="form-label small">Tipo de movimiento</label>
                <select class="form-select form-select-sm" id="m-tipo">
                  <option value="ENTRADA">Entrada (ingreso de mercaderia)</option>
                  <option value="SALIDA">Salida (merma / uso interno)</option>
                  <option value="AJUSTE">Ajuste (corregir stock al valor indicado)</option>
                  <option value="DEVOLUCION">Devolucion</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label small" id="m-cantidad-label">Cantidad</label>
                <input type="number" min="0" class="form-control form-control-sm" id="m-cantidad" required>
              </div>
              <div class="mb-2">
                <label class="form-label small">Motivo (opcional)</label>
                <input type="text" class="form-control form-control-sm" id="m-motivo">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-admin-primary btn-sm">Registrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin/admin-layout.js"></script>
  <script src="/js/admin/pages/inventario.js"></script>
</body>
</html>
