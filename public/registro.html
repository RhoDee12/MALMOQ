<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - MALMOQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="site-header"></div>

  <main class="container">
    <div class="auth-card">
      <h1 class="font-black text-center mb-4">Crear cuenta</h1>
      <div id="registro-error" class="alert alert-danger" hidden></div>
      <form id="form-registro">
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small">Nombre</label>
            <input type="text" class="form-control" id="input-nombre" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Apellidos</label>
            <input type="text" class="form-control" id="input-apellidos" required>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label small">Correo</label>
          <input type="email" class="form-control" id="input-email" required>
        </div>
        <div class="mb-2">
          <label class="form-label small">Celular</label>
          <input type="text" class="form-control" id="input-celular">
        </div>
        <div class="mb-2">
          <label class="form-label small">Direccion (opcional)</label>
          <input type="text" class="form-control" id="input-direccion">
        </div>
        <div class="mb-2">
          <label class="form-label small">Referencia (opcional)</label>
          <input type="text" class="form-control" id="input-referencia">
        </div>
        <div class="mb-3">
          <label class="form-label small">Contrasena (minimo 6 caracteres)</label>
          <input type="password" class="form-control" id="input-password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btn-registro">Crear cuenta</button>
      </form>
      <p class="text-center small mt-3">
        Ya tienes cuenta? <a href="/login.html">Inicia sesion</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/registro.js"></script>
</body>
</html>
